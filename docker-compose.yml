# =============================================================================
#  Stack Zabbix 7.0 LTS — Red Las Lagunitas (entorno LAB)
#  Secretos y parámetros en .env (ver .env.example). Producción: deploy/produccion/
# =============================================================================

services:
  mysql-server:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --log-bin-trust-function-creators=1
      - --innodb-buffer-pool-size=512M
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - zabbix_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-mysql:ubuntu-7.0.30
    environment:
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      ZBX_SERVER_NAME: ${ZBX_SERVER_NAME}
      ZBX_STARTPINGERS: 4          # checks ICMP (fping) en paralelo
      ZBX_STARTPOLLERS: 10
      ZBX_STARTHTTPAGENTPOLLERS: 2 # items HTTP agent (API UniFi)
      ZBX_CACHESIZE: 64M
      ZBX_TIMEOUT: 10
    ports:
      - "10051:10051"
    networks:
      - zabbix_net
      - lagunitas_net
    depends_on:
      mysql-server:
        condition: service_healthy
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-apache-mysql:ubuntu-7.0.30
    environment:
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_NAME: ${ZBX_SERVER_NAME}
      PHP_TZ: ${PHP_TZ}
    ports:
      - "${ZABBIX_WEB_PORT:-8090}:8080"
    volumes:
      # Módulos propios del frontend (widget "Red Las Lagunitas" y reporte de disponibilidad)
      - ./zabbix/modules/lagunitas-red:/usr/share/zabbix/modules/lagunitas-red:ro
      - ./zabbix/modules/lagunitas-reportes:/usr/share/zabbix/modules/lagunitas-reportes:ro
      - ./zabbix/modules/lagunitas-descubrimiento:/usr/share/zabbix/modules/lagunitas-descubrimiento:ro
    networks:
      - zabbix_net
    depends_on:
      - zabbix-server
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Agente para el auto-monitoreo del servidor (host "Zabbix server").
  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-7.0.30
    hostname: zabbix-agent
    environment:
      ZBX_HOSTNAME: Zabbix server
      ZBX_SERVER_HOST: zabbix-server
    networks:
      zabbix_net:
        aliases: [zabbix-agent]
    restart: unless-stopped

networks:
  zabbix_net:
    driver: bridge
  lagunitas_net:
    external: true
