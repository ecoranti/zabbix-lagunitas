# =============================================================================
#  Inventario de la Red Comunitaria y Científica Las Lagunitas — entorno LAB
# =============================================================================
#  Fuente única de verdad: a partir de este archivo el provisionador crea/actualiza
#  en Zabbix los grupos, hosts, tags, inventario, templates, dependencias entre
#  triggers, el mapa de topología, los servicios/SLA y los dashboards; y el
#  simulador de laboratorio levanta un contenedor por cada equipo operativo
#  (con agente SNMP simulado para los perfiles airos_snmp / mikrotik_snmp).
#
#  Topología: "Gráfico esquemático" de campo (09/09/25) + inventario de equipos del
#  informe de relevamiento. 1 gateway, 4 torres, 9 nodos, 13 hogares/instituciones.
#
#  Campos de cada SITIO (elemento del mapa):
#    host      Nombre técnico en Zabbix (sin espacios; es la clave, no cambiar).
#    nombre    Nombre visible.
#    rol       gateway | torre | nodo | hogar | institucion | ap
#    ip        IP de gestión del equipo PRINCIPAL del sitio.
#    padre     Equipo del que depende su conectividad (sitio o dispositivo).
#    estado    operativo | en_proceso | sin_configurar (solo "operativo" se monitorea)
#    perfiles  icmp | airos_snmp | mikrotik_snmp | unifi_api (se combinan)
#    funcion   ap | sm | ptp | router | switch | otro (función del equipo principal)
#    modelo    Modelo exacto (se guarda en el inventario de Zabbix)
#    equipo    Descripción libre del hardware del sitio
#    mapa      Posición [x, y] en el mapa de topología
#    dispositivos  (opcional) otros equipos del mismo sitio, cada uno con host,
#              nombre, ip, funcion, modelo, perfiles y padre (por defecto: el
#              equipo principal del sitio). Se monitorean como hosts propios.
# =============================================================================

