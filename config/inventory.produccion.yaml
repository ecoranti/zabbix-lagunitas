# =============================================================================
#  Inventario de la Red Las Lagunitas — entorno PRODUCCIÓN (red real)
# =============================================================================
#  Misma estructura y topología que el LAB. ANTES DE APROVISIONAR, recorrer la
#  "Guía de integración de equipos" (docs/guia-integracion-equipos.md) y completar:
#
#   1. ip        IP de gestión REAL de cada equipo (reemplazar las marcadas COMPLETAR;
#                192.168.88.x es solo el rango por defecto del Mikrotik).
#   2. perfiles  [icmp] para todo equipo; + airos_snmp en radios Ubiquiti airMAX con
#                SNMP habilitado; + mikrotik_snmp en el router Mikrotik.
#                Si un equipo todavía no tiene SNMP, dejar solo [icmp].
#   3. modelo    Modelo exacto (airOS -> System -> Device Model).
#   4. funcion   ap / sm / ptp / router (según su configuración real).
#   5. estado    operativo solo para los tramos en servicio.
#   6. padre     confirmar la topología: de qué equipo depende cada uno.
#   7. dispositivos  agregar todos los equipos con IP de cada sitio (AP + SM + router).
#
#  Validar sin tocar Zabbix:   bin/lagunitas -i config/inventory.produccion.yaml validar
# =============================================================================

