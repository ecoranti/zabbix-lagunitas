# =============================================================================
#  Inventario de la Red Comunitaria y Científica Las Lagunitas — entorno LAB
# =============================================================================
#  Fuente única de verdad: a partir de este archivo el provisionador crea/actualiza
#  en Zabbix los grupos, hosts, tags, inventario, templates, dependencias entre
#  triggers, el mapa de topología, los servicios/SLA y los dashboards; y el
#  simulador de laboratorio levanta un contenedor por cada elemento operativo.
#
#  Topología relevada del "Gráfico esquemático" de campo (09/09/25):
#    4 torres (backbone), 9 nodos intermedios, 13 hogares/instituciones.
#
#  Campos por elemento:
#    host     Nombre técnico en Zabbix (sin espacios, no cambiar: es la clave).
#    nombre   Nombre visible.
#    rol      torre | nodo | hogar | institucion | ap
#    ip       IP de gestión (en LAB: red Docker 10.50.0.0/24).
#    padre    Elemento del que depende su conectividad (para dependencias de
#             triggers: si cae el padre no se alerta por todos los hijos).
#    estado   operativo | en_proceso | sin_configurar
#             Solo los "operativo" se monitorean; el resto se crea deshabilitado
#             (se ven en gris en el mapa) hasta que se pongan en servicio.
#    perfiles Perfiles de monitoreo (ver "perfiles" al final).
#    equipo   Hardware instalado, según relevamiento (informativo -> inventario).
#    mapa     Posición [x, y] en el mapa de topología.
# =============================================================================

sitio: Las Lagunitas
entorno: lab
descripcion: Laboratorio Docker (Mac M3 / Colima) que replica la topología real.

