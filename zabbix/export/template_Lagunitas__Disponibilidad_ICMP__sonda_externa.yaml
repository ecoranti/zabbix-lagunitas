zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 861b1d1f6bfb4ede924e44a88146dcff
      name: 'Templates/Las Lagunitas'
  templates:
    - uuid: 4d2d77d65883498bbbdc855196f051c8
      template: 'Lagunitas - Disponibilidad ICMP - sonda externa'
      name: 'Lagunitas - Disponibilidad ICMP - sonda externa'
      description: 'SOLO LABORATORIO. Disponibilidad, pérdida y latencia medidas por la sonda del host (bin/lagunitas lab sonda) y enviadas a Zabbix: la red de Colima responde el ping de cualquier IP externa, así que el fping del server no es confiable allí.'
      groups:
        - name: 'Templates/Las Lagunitas'
      items:
        - uuid: 7f3018164bcd475ca9c44d5bf962cd76
          name: 'Disponibilidad (ICMP)'
          type: TRAP
          key: icmpping
          delay: '0'
          history: 90d
          description: '1 si el equipo responde al ping, 0 si no responde.'
          valuemap:
            name: 'Lagunitas - Estado'
          tags:
            - tag: componente
              value: disponibilidad
          triggers:
            - uuid: 851f9514681940a0b9d32faadb30ca65
              expression: 'nodata(/Lagunitas - Disponibilidad ICMP - sonda externa/icmpping,3m)=1'
              name: '{HOST.NAME}: la sonda ICMP no envía datos'
              priority: WARNING
              description: 'La sonda del laboratorio está detenida: bin/lagunitas lab sonda (o el agente launchd ar.lagunitas.sonda-icmp).'
              tags:
                - tag: alcance
                  value: monitoreo
                - tag: equipo
                  value: '{HOST.HOST}'
            - uuid: fa9962fbdac040a6974a207bd4a899f8
              expression: 'max(/Lagunitas - Disponibilidad ICMP - sonda externa/icmpping,{$ICMP.CAIDA.PERIODO})=0'
              name: '{HOST.NAME}: sin respuesta (ICMP)'
              opdata: Caído
              priority: HIGH
              description: 'El equipo no respondió al ping durante {$ICMP.CAIDA.PERIODO} (chequeo cada {$LAGUNITAS.INTERVALO}). Revisar alimentación (panel solar/batería), el enlace hacia su equipo padre y el propio equipo. Si el padre también está caído, esta alerta queda suprimida por dependencia.'
              tags:
                - tag: alcance
                  value: disponibilidad
                - tag: equipo
                  value: '{HOST.HOST}'
        - uuid: 639ea34d02ad4e4fb35484dbfd4cdc35
          name: 'Pérdida de paquetes (ICMP)'
          type: TRAP
          key: icmppingloss
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: '%'
          tags:
            - tag: componente
              value: disponibilidad
          triggers:
            - uuid: 3f169c4da17941c1a06c0e3d275d6f4a
              expression: 'min(/Lagunitas - Disponibilidad ICMP - sonda externa/icmppingloss,5m)>{$ICMP.PERDIDA.WARN} and min(/Lagunitas - Disponibilidad ICMP - sonda externa/icmppingloss,5m)<100'
              name: '{HOST.NAME}: pérdida de paquetes alta'
              opdata: 'Pérdida: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Pérdida sostenida por encima de {$ICMP.PERDIDA.WARN}% durante 5 minutos: posible interferencia, desalineación de antena o saturación del enlace.'
              dependencies:
                - name: '{HOST.NAME}: sin respuesta (ICMP)'
                  expression: 'max(/Lagunitas - Disponibilidad ICMP - sonda externa/icmpping,{$ICMP.CAIDA.PERIODO})=0'
              tags:
                - tag: alcance
                  value: calidad
                - tag: equipo
                  value: '{HOST.HOST}'
        - uuid: 91d699e21bce49f3b588d8902b5afdf3
          name: 'Latencia (ICMP)'
          type: TRAP
          key: icmppingsec
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: s
          tags:
            - tag: componente
              value: disponibilidad
          triggers:
            - uuid: 652c301593a84f75ac7b7768399bdee9
              expression: 'avg(/Lagunitas - Disponibilidad ICMP - sonda externa/icmppingsec,5m)>{$ICMP.LATENCIA.WARN}'
              name: '{HOST.NAME}: latencia alta'
              opdata: 'Latencia: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Latencia promedio de 5 minutos por encima de {$ICMP.LATENCIA.WARN} s.'
              dependencies:
                - name: '{HOST.NAME}: sin respuesta (ICMP)'
                  expression: 'max(/Lagunitas - Disponibilidad ICMP - sonda externa/icmpping,{$ICMP.CAIDA.PERIODO})=0'
              tags:
                - tag: alcance
                  value: calidad
                - tag: equipo
                  value: '{HOST.HOST}'
        - uuid: 7bb94b8a85c843e38ac7850667231a83
          name: 'Disponibilidad últimos 7 días'
          type: CALCULATED
          key: 'lagunitas.disponibilidad[7d]'
          history: 90d
          value_type: FLOAT
          units: '%'
          params: 'avg(//icmpping,7d)*100'
          tags:
            - tag: componente
              value: disponibilidad
        - uuid: 2110ab6de9424224a772381e8fa636ae
          name: 'Disponibilidad últimas 24 h'
          type: CALCULATED
          key: 'lagunitas.disponibilidad[24h]'
          history: 90d
          value_type: FLOAT
          units: '%'
          params: 'avg(//icmpping,24h)*100'
          tags:
            - tag: componente
              value: disponibilidad
      tags:
        - tag: clase
          value: red
        - tag: objetivo
          value: disponibilidad
      macros:
        - macro: '{$ICMP.CAIDA.PERIODO}'
          value: 90s
          description: 'Tiempo sin respuesta al ping para declarar el equipo caído'
        - macro: '{$ICMP.LATENCIA.WARN}'
          value: '0.15'
          description: 'Latencia promedio (s) en 5 min que dispara advertencia (150 ms)'
        - macro: '{$ICMP.PERDIDA.WARN}'
          value: '20'
          description: 'Pérdida de paquetes (%) sostenida 5 min que dispara advertencia'
