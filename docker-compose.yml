services:
  mysql-server:
    image: mysql:8.0
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - zabbix_net
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-mysql:ubuntu-7.0-latest
    environment:
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix_password
      ZBX_SERVER_NAME: "Red Las Lagunitas - Lab"
      ZBX_STARTPINGERS: 4
    ports:
      - "10051:10051"
    networks:
      - zabbix_net
      - lagunitas_net
    restart: unless-stopped
    depends_on:
      - mysql-server

  zabbix-web:
    image: zabbix/zabbix-web-apache-mysql:ubuntu-7.0-latest
    environment:
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix_password
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Argentina/Cordoba
    ports:
      - "8090:8080"
    networks:
      - zabbix_net
    restart: unless-stopped
    depends_on:
      - zabbix-server

networks:
  zabbix_net:
    driver: bridge
  lagunitas_net:
    external: true
