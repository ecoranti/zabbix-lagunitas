zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 861b1d1f6bfb4ede924e44a88146dcff
      name: 'Templates/Las Lagunitas'
  templates:
    - uuid: cc8517ff951247daa92a5dcf50bb3105
      template: 'Lagunitas - AP UniFi por API'
      name: 'Lagunitas - AP UniFi por API'
      description: 'Access point UniFi monitoreado por la API de integración de UniFi Network (UniFi OS). Requiere una API key (Integrations -> Create API Key) en la macro secreta {$UNIFI.API.KEY} del host.'
      groups:
        - name: 'Templates/Las Lagunitas'
      items:
        - uuid: 66ab49399f544e61a5e6c727f8938d96
          name: 'AP: clientes conectados'
          type: DEPENDENT
          key: ap.clients.count
          delay: '0'
          history: 90d
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.data[?(@.uplinkDeviceId=="{$UNIFI.DEVICE.ID}")].length()'
          master_item:
            key: ap.clients.raw
          tags:
            - tag: componente
              value: rendimiento
        - uuid: c484ca2d905a4f2ca1ddaba2cc0321c1
          name: 'AP: clientes del sitio (JSON crudo)'
          type: HTTP_AGENT
          key: ap.clients.raw
          history: 1d
          value_type: TEXT
          trends: '0'
          timeout: 10s
          url: 'https://{$UNIFI.HOST}:{$UNIFI.PORT}{$UNIFI.API.PATH}/sites/{$UNIFI.SITE.ID}/clients?limit=200'
          headers:
            - name: X-API-KEY
              value: '{$UNIFI.API.KEY}'
            - name: Accept
              value: application/json
          tags:
            - tag: componente
              value: api
        - uuid: cf834148bf004e2383506c35e795a0a6
          name: 'AP: uso de CPU'
          type: DEPENDENT
          key: ap.cpu.util
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.cpuUtilizationPct
          master_item:
            key: ap.stats.raw
          tags:
            - tag: componente
              value: rendimiento
          triggers:
            - uuid: 82530d9cf3c0411fbaefec7afc634ec5
              expression: 'min(/Lagunitas - AP UniFi por API/ap.cpu.util,5m)>{$AP.CPU.WARN}'
              name: '{HOST.NAME}: uso de CPU alto'
              opdata: 'Cpu: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: '{HOST.NAME}: AP fuera de línea según UniFi'
                  expression: 'last(/Lagunitas - AP UniFi por API/ap.disponible)=0'
              tags:
                - tag: alcance
                  value: rendimiento
                - tag: equipo
                  value: '{HOST.HOST}'
        - uuid: 39d7ba455d0c4fc7b9220ef6fdde9026
          name: 'AP: dispositivo (JSON crudo)'
          type: HTTP_AGENT
          key: ap.device.raw
          delay: 2m
          history: 1d
          value_type: TEXT
          trends: '0'
          timeout: 10s
          url: 'https://{$UNIFI.HOST}:{$UNIFI.PORT}{$UNIFI.API.PATH}/sites/{$UNIFI.SITE.ID}/devices/{$UNIFI.DEVICE.ID}'
          headers:
            - name: X-API-KEY
              value: '{$UNIFI.API.KEY}'
            - name: Accept
              value: application/json
          tags:
            - tag: componente
              value: api
        - uuid: 14184951d9b1469eb30f8cd45f25f6ea
          name: 'Disponibilidad (UniFi)'
          type: DEPENDENT
          key: ap.disponible
          delay: '0'
          history: 90d
          valuemap:
            name: 'Lagunitas - Estado AP'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return JSON.parse(value).state === ''ONLINE'' ? 1 : 0;'
          master_item:
            key: ap.device.raw
          tags:
            - tag: componente
              value: disponibilidad
          triggers:
            - uuid: 8caf4c4c305a4294aabbd404c4f6fb9d
              expression: 'last(/Lagunitas - AP UniFi por API/ap.disponible)=0'
              name: '{HOST.NAME}: AP fuera de línea según UniFi'
              opdata: 'Estado: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'El controlador informa el AP en un estado distinto de ONLINE.'
              dependencies:
                - name: '{HOST.NAME}: sin datos de la API de UniFi'
                  expression: 'nodata(/Lagunitas - AP UniFi por API/ap.stats.raw,{$AP.SIN.DATOS})=1'
              tags:
                - tag: alcance
                  value: disponibilidad
                - tag: equipo
                  value: '{HOST.HOST}'
        - uuid: 66698275cc554e1f8c1b6c11b8af7e5d
          name: 'AP: estado informado por UniFi'
          type: DEPENDENT
          key: ap.estado
          delay: '0'
          history: 30d
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.state
          master_item:
            key: ap.device.raw
          tags:
            - tag: componente
              value: disponibilidad
        - uuid: 63755b49e80240e9b74cfb94c94f1f2b
          name: 'AP: versión de firmware'
          type: DEPENDENT
          key: ap.firmware
          delay: '0'
          history: 365d
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.firmwareVersion
              error_handler: DISCARD_VALUE
          master_item:
            key: ap.device.raw
          tags:
            - tag: componente
              value: sistema
          triggers:
            - uuid: ac875b6450b741f98d3404fc4aae0b70
              expression: 'last(/Lagunitas - AP UniFi por API/ap.firmware,#1)<>last(/Lagunitas - AP UniFi por API/ap.firmware,#2)'
              name: '{HOST.NAME}: cambió la versión de firmware'
              priority: INFO
              manual_close: 'YES'
              tags:
                - tag: alcance
                  value: sistema
                - tag: equipo
                  value: '{HOST.HOST}'
        - uuid: 1743a9c10d7b42b88fd2903811c5b72e
          name: 'AP: load average (1 min)'
          type: DEPENDENT
          key: ap.load1
          delay: '0'
          history: 90d
          value_type: FLOAT
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.loadAverage1Min
          master_item:
            key: ap.stats.raw
          tags:
            - tag: componente
              value: rendimiento
        - uuid: 4f602d5333914326827e01528f6e394e
          name: 'AP: uso de memoria'
          type: DEPENDENT
          key: ap.mem.util
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.memoryUtilizationPct
          master_item:
            key: ap.stats.raw
          tags:
            - tag: componente
              value: rendimiento
          triggers:
            - uuid: 7131cd9770fa4c6894bdb27425967286
              expression: 'min(/Lagunitas - AP UniFi por API/ap.mem.util,5m)>{$AP.MEM.WARN}'
              name: '{HOST.NAME}: uso de memoria alto'
              opdata: 'Memoria: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: '{HOST.NAME}: AP fuera de línea según UniFi'
                  expression: 'last(/Lagunitas - AP UniFi por API/ap.disponible)=0'
              tags:
                - tag: alcance
                  value: rendimiento
                - tag: equipo
                  value: '{HOST.HOST}'
        - uuid: 470b9d37a85245da808e12bc52623485
          name: 'AP: modelo'
          type: DEPENDENT
          key: ap.modelo
          delay: '0'
          history: 365d
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.model
              error_handler: DISCARD_VALUE
          master_item:
            key: ap.device.raw
          tags:
            - tag: componente
              value: sistema
        - uuid: 3e18d8bb3fd8481da8d2687b67f7a88a
          name: 'AP: reintentos TX radio 5 GHz'
          type: DEPENDENT
          key: ap.radio.5ghz.retries
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.interfaces.radios[1].txRetriesPct'
              error_handler: DISCARD_VALUE
          master_item:
            key: ap.stats.raw
          tags:
            - tag: componente
              value: radio
          triggers:
            - uuid: 0cc4874a5ac34f5e90b4f390bc7b8b45
              expression: 'avg(/Lagunitas - AP UniFi por API/ap.radio.5ghz.retries,15m)>{$AP.REINTENTOS.WARN}'
              name: '{HOST.NAME}: reintentos altos en 5 GHz'
              opdata: 'Reintentos: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Reintentos de transmisión sostenidos en 5 GHz: interferencia, canal saturado o clientes con mala señal.'
              dependencies:
                - name: '{HOST.NAME}: AP fuera de línea según UniFi'
                  expression: 'last(/Lagunitas - AP UniFi por API/ap.disponible)=0'
              tags:
                - tag: alcance
                  value: radio
                - tag: equipo
                  value: '{HOST.HOST}'
        - uuid: 9f170265015146a8a0b8d2a3796d1897
          name: 'AP: reintentos TX radio 6 GHz'
          type: DEPENDENT
          key: ap.radio.6ghz.retries
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.interfaces.radios[2].txRetriesPct'
              error_handler: DISCARD_VALUE
          master_item:
            key: ap.stats.raw
          tags:
            - tag: componente
              value: radio
          triggers:
            - uuid: 7d786c65294a407ab754d417771210ec
              expression: 'avg(/Lagunitas - AP UniFi por API/ap.radio.6ghz.retries,15m)>{$AP.REINTENTOS.WARN}'
              name: '{HOST.NAME}: reintentos altos en 6 GHz'
              opdata: 'Reintentos: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Reintentos de transmisión sostenidos en 6 GHz: interferencia, canal saturado o clientes con mala señal.'
              dependencies:
                - name: '{HOST.NAME}: AP fuera de línea según UniFi'
                  expression: 'last(/Lagunitas - AP UniFi por API/ap.disponible)=0'
              tags:
                - tag: alcance
                  value: radio
                - tag: equipo
                  value: '{HOST.HOST}'
        - uuid: 1c47dfcc752c40838f7eca1e2f59cb4f
          name: 'AP: reintentos TX radio 2.4 GHz'
          type: DEPENDENT
          key: ap.radio.24ghz.retries
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.interfaces.radios[0].txRetriesPct'
              error_handler: DISCARD_VALUE
          master_item:
            key: ap.stats.raw
          tags:
            - tag: componente
              value: radio
          triggers:
            - uuid: 300a944fde754a308edc3ee9e649e855
              expression: 'avg(/Lagunitas - AP UniFi por API/ap.radio.24ghz.retries,15m)>{$AP.REINTENTOS.WARN}'
              name: '{HOST.NAME}: reintentos altos en 2.4 GHz'
              opdata: 'Reintentos: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Reintentos de transmisión sostenidos en 2.4 GHz: interferencia, canal saturado o clientes con mala señal.'
              dependencies:
                - name: '{HOST.NAME}: AP fuera de línea según UniFi'
                  expression: 'last(/Lagunitas - AP UniFi por API/ap.disponible)=0'
              tags:
                - tag: alcance
                  value: radio
                - tag: equipo
                  value: '{HOST.HOST}'
        - uuid: 9091b788b5044b90a10b00b3f6d64f35
          name: 'AP: estadísticas (JSON crudo)'
          type: HTTP_AGENT
          key: ap.stats.raw
          history: 1d
          value_type: TEXT
          trends: '0'
          timeout: 10s
          url: 'https://{$UNIFI.HOST}:{$UNIFI.PORT}{$UNIFI.API.PATH}/sites/{$UNIFI.SITE.ID}/devices/{$UNIFI.DEVICE.ID}/statistics/latest'
          headers:
            - name: X-API-KEY
              value: '{$UNIFI.API.KEY}'
            - name: Accept
              value: application/json
          tags:
            - tag: componente
              value: api
          triggers:
            - uuid: 6b489db43c9640c8b068f0c2034b7527
              expression: 'nodata(/Lagunitas - AP UniFi por API/ap.stats.raw,{$AP.SIN.DATOS})=1'
              name: '{HOST.NAME}: sin datos de la API de UniFi'
              priority: AVERAGE
              description: 'La API responde pero no entrega estadísticas: revisar API key, site/device ID.'
              dependencies:
                - name: '{HOST.NAME}: controlador UniFi no accesible'
                  expression: 'max(/Lagunitas - AP UniFi por API/net.tcp.service[https,{$UNIFI.HOST},{$UNIFI.PORT}],#3)=0'
              tags:
                - tag: alcance
                  value: api
                - tag: equipo
                  value: '{HOST.HOST}'
        - uuid: 2111fe04ddd94dedb23e7579d7f2f2ca
          name: 'AP: uplink RX'
          type: DEPENDENT
          key: ap.uplink.rx
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: bps
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.uplink.rxRateBps
              error_handler: DISCARD_VALUE
          master_item:
            key: ap.stats.raw
          tags:
            - tag: componente
              value: rendimiento
        - uuid: 06e82ebca06940d3b22ea0913852e8f1
          name: 'AP: uplink TX'
          type: DEPENDENT
          key: ap.uplink.tx
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: bps
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.uplink.txRateBps
              error_handler: DISCARD_VALUE
          master_item:
            key: ap.stats.raw
          tags:
            - tag: componente
              value: rendimiento
        - uuid: 5d36300cc6b44c11aa9039c270f4e69a
          name: 'AP: uptime'
          type: DEPENDENT
          key: ap.uptime
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: uptime
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.uptimeSec
          master_item:
            key: ap.stats.raw
          tags:
            - tag: componente
              value: sistema
          triggers:
            - uuid: 0e4812149371478282900e316daa4909
              expression: 'last(/Lagunitas - AP UniFi por API/ap.uptime)<600'
              name: '{HOST.NAME}: el AP se reinició'
              priority: INFO
              description: 'Uptime menor a 10 minutos: reinicio por corte de energía o actualización.'
              manual_close: 'YES'
              tags:
                - tag: alcance
                  value: sistema
                - tag: equipo
                  value: '{HOST.HOST}'
        - uuid: 87a88538f0b44c03accfe6e655c806d1
          name: 'Controlador UniFi: HTTPS accesible'
          type: SIMPLE
          key: 'net.tcp.service[https,{$UNIFI.HOST},{$UNIFI.PORT}]'
          history: 90d
          valuemap:
            name: 'Lagunitas - Servicio'
          tags:
            - tag: componente
              value: api
          triggers:
            - uuid: 9bd1fb5cf21845f28832ff532c3115e9
              expression: 'max(/Lagunitas - AP UniFi por API/net.tcp.service[https,{$UNIFI.HOST},{$UNIFI.PORT}],#3)=0'
              name: '{HOST.NAME}: controlador UniFi no accesible'
              priority: AVERAGE
              description: 'No se puede abrir conexión HTTPS con el controlador UniFi: sin él no hay métricas del AP. Verificar que UniFi OS Server esté encendido y el puerto.'
              tags:
                - tag: alcance
                  value: api
                - tag: equipo
                  value: '{HOST.HOST}'
      tags:
        - tag: clase
          value: red
        - tag: fabricante
          value: ubiquiti
        - tag: objetivo
          value: wifi
      macros:
        - macro: '{$AP.CPU.WARN}'
          value: '85'
          description: 'CPU (%) sostenida 5 min'
        - macro: '{$AP.MEM.WARN}'
          value: '85'
          description: 'Memoria (%) sostenida 5 min'
        - macro: '{$AP.REINTENTOS.WARN}'
          value: '20'
          description: 'Reintentos TX (%) promedio 15 min'
        - macro: '{$AP.SIN.DATOS}'
          value: 5m
          description: 'Tiempo sin datos de la API'
        - macro: '{$UNIFI.API.KEY}'
          type: SECRET_TEXT
          description: 'API key (macro secreta, se define a nivel host)'
        - macro: '{$UNIFI.API.PATH}'
          value: /proxy/network/integration/v1
          description: 'Ruta base de la API de integración'
        - macro: '{$UNIFI.DEVICE.ID}'
          description: 'ID del AP (GET /sites/{id}/devices)'
        - macro: '{$UNIFI.HOST}'
          description: 'IP/DNS del controlador UniFi'
        - macro: '{$UNIFI.PORT}'
          value: '443'
          description: 'Puerto HTTPS del controlador'
        - macro: '{$UNIFI.SITE.ID}'
          description: 'ID del site (GET /sites)'
      dashboards:
        - uuid: 07dcfc4b9814400aa2770d01f47a2dc9
          name: 'Detalle del AP UniFi'
          pages:
            - name: Resumen
              widgets:
                - type: item
                  name: Estado
                  width: '18'
                  height: '4'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'Lagunitas - AP UniFi por API'
                        key: ap.disponible
                    - type: INTEGER
                      name: show.0
                      value: '1'
                    - type: INTEGER
                      name: show.1
                      value: '2'
                    - type: INTEGER
                      name: show.2
                      value: '3'
                    - type: STRING
                      name: thresholds.0.color
                      value: E53935
                    - type: STRING
