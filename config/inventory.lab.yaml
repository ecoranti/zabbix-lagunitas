  # ------------------------------------------- Equipo real del laboratorio
  # AP UniFi de la casa del alumno: único equipo físico del LAB. No forma parte
  # de la topología de campo, por eso no tiene padre.
  # IMPORTANTE (LAB sobre Colima): la red de Colima responde ICMP por cualquier
  # IP externa, así que un ping al AP desde el LAB siempre "responde". Por eso
  # aquí NO se usa el perfil icmp: la disponibilidad del AP sale del estado que
  # informa la API de UniFi (ONLINE/OFFLINE). En producción (Linux) ICMP es real.
  - host: AP-U7-Pro-Wall
    nombre: AP U7 Pro Wall (real)
    rol: ap
    ip: 192.168.1.113
    padre: null
    estado: operativo
    perfiles: [unifi_api]
    funcion: ap
    modelo: Ubiquiti UniFi U7 Pro Wall
    equipo: Ubiquiti UniFi U7 Pro Wall
    mapa: [110, 290]
    macros:
      "{$UNIFI.HOST}": 192.168.1.81   # UniFi OS Server en esta Mac (Gala)
      "{$UNIFI.PORT}": "11443"
      "{$UNIFI.SITE.ID}": 88f7af54-98f8-306a-a1c7-c9349722b1f6
      "{$UNIFI.DEVICE.ID}": afd2ff68-17b3-3b64-8473-8eebfbe60d12
      # {$UNIFI.API.KEY} se carga desde la variable de entorno UNIFI_API_KEY
      # como macro secreta: nunca se escribe en este archivo.

