# =============================================================================
#  Inventario de la Red Las Lagunitas — entorno PRODUCCIÓN (red real)
# =============================================================================
#  Misma topología que el LAB (gráfico esquemático de campo 09/09/25).
#
#  ANTES DE APROVISIONAR, COMPLETAR (ver docs/guia-implementacion.md §4.6):
#   1. "ip": reemplazar las IPs de ejemplo (192.168.88.x, rango por defecto del
#      Mikrotik) por la IP de gestión REAL de cada equipo. Buscar "COMPLETAR".
#   2. "perfiles": [icmp] funciona con todo equipo. Agregar airos_snmp en los
#      equipos Ubiquiti airMAX (PowerBeam, LiteBeam, NanoLoco) con SNMP habilitado
#      y mikrotik_snmp en el router Mikrotik.
#   3. "estado": marcar operativo solo los tramos en servicio.
#   4. "padre": confirmar la topología real.
#
#  Validar sin tocar Zabbix:
#    bin/lagunitas -i config/inventory.produccion.yaml validar
# =============================================================================

sitio: Las Lagunitas
entorno: produccion
descripcion: Red WISP comunitaria real, monitoreada desde el servidor del nodo UNRC.

